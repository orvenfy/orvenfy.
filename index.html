<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>ORVENFY</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--p:#141414;--p2:#2d2d2d;--ln:#262626;--o:#ff6a1a;--o2:#ff9a4d;--tx:#fff;--mu:#b3b3b3;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:400 16px/1.45 Inter,"Helvetica Neue",Arial,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.app{display:flex;flex-direction:column;height:100%}
main{flex:1;overflow-y:auto;display:flex;justify-content:center}
#v{width:100%;max-width:640px;padding:0 16px 28px}
nav{display:flex;justify-content:space-around;background:#000;border-top:1px solid var(--ln);padding:6px 0}
nav button{padding:8px 12px;color:var(--mu);border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px}nav button.on{color:var(--o)}nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
@media(min-width:900px){.app{flex-direction:row-reverse}nav{flex-direction:column;justify-content:flex-start;gap:8px;width:84px;border-top:0;border-right:1px solid var(--ln);padding:20px 0;align-items:center}}
.bn{width:100%;border-radius:14px;margin:12px 0 0;display:block}
.arc{height:44px;margin:-4px -16px 8px;border-top:3px solid var(--o);border-radius:50% 50% 0 0/100% 100% 0 0;background:radial-gradient(ellipse 60% 100% at 50% 0,#ff6a1a40,transparent);box-shadow:0 -6px 24px #ff6a1a55}
h2{font-size:24px;font-weight:800;margin:14px 0 10px}h3{font-size:20px;font-weight:800;margin:20px 0 10px}
.card{background:linear-gradient(150deg,#241209,#0e0e10 65%);border:1px solid #ffffff14;border-radius:20px;margin-bottom:14px;overflow:hidden}
.pad{padding:14px}.row{display:flex;align-items:center;gap:10px}.sp{flex:1}.mu{color:var(--mu);font-size:14px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--o),#5a2a10);flex:none;display:grid;place-items:center;font-weight:700}.av.big{width:84px;height:84px;font-size:30px}
.btn{background:linear-gradient(#ff7a2a,#f25a0c);color:#fff;font-weight:700;padding:10px 20px;border-radius:999px}
.btn.g{background:#262626;color:var(--tx);border:1px solid #3a3a3a}.btn.w{display:block;width:100%;padding:14px;font-size:17px;margin-top:10px;text-align:center}
.cta{position:sticky;bottom:12px;z-index:5;box-shadow:0 8px 24px #000c}
.img{height:240px;background:linear-gradient(135deg,#2a2a32,#3b2414);display:grid;place-items:center;color:var(--mu)}
.act{display:flex;gap:18px;padding:10px 14px;border-top:1px solid #ffffff14}.act button{color:var(--tx);display:flex;gap:6px;align-items:center}.act .on{color:var(--o)}.act .sv{color:#fff}.act svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
input,select,textarea{width:100%;background:#161616b3;border:1px solid #808080;border-radius:8px;padding:16px 14px;margin-bottom:12px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--o)}textarea{min-height:130px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.tile{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:4px;padding:8px;font-weight:700;font-size:13px;border:1px solid #ffffff1a;text-align:left}
.cr{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none}.cr::-webkit-scrollbar{display:none}
.pst{flex:none;width:128px;aspect-ratio:2/3;border-radius:10px;position:relative;scroll-snap-align:start;display:flex;align-items:flex-end;padding:8px;font-weight:700;font-size:13px;text-align:left;border:1px solid #ffffff1a;z-index:1}
.nl{position:absolute;top:6px;left:8px;color:var(--o);font-weight:800;font-size:20px;line-height:1;font-style:normal}
.rkw{flex:none;display:flex;align-items:flex-end;scroll-snap-align:start}.rn{font-size:120px;line-height:.78;font-weight:800;color:transparent;-webkit-text-stroke:3px #fff;margin-right:-22px;letter-spacing:-.08em;z-index:0}
.faq{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--p2);padding:20px 18px;margin-bottom:8px;font-size:17px;border-radius:6px;text-align:left}.faq:after{content:'+';font-size:30px;font-weight:300;line-height:1}.faq.nx:after{content:''}
.hero{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid #ffffff1a}.hero .pl{position:absolute;inset:0;display:grid;place-items:center;width:100%}.hero i{width:64px;height:64px;border-radius:50%;background:#0009;border:2px solid #fff;display:grid;place-items:center;font-style:normal;color:var(--o);font-size:26px}
.badge{display:inline-block;background:#ffffff26;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;margin-left:6px}
.tabs{overflow-x:auto;display:flex;border-bottom:1px solid var(--ln);margin:12px 0}.tabs button{flex:1;white-space:nowrap;padding:10px;color:var(--mu);font-weight:600}.tabs .on{color:var(--tx);border-bottom:3px solid var(--o)}
.chip{display:inline-block;padding:6px 14px;border-radius:20px;background:var(--p2);margin:0 6px 6px 0;font-size:13px}
.sheet{position:fixed;inset:0;background:#000b;display:flex;align-items:end;justify-content:center;z-index:9}
.sheet>div{background:linear-gradient(160deg,#1c120b,#101012 60%);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px;max-height:90%;overflow:auto;border:1px solid #ffffff14}
@media(min-width:900px){.sheet{align-items:center}.sheet>div{border-radius:22px}}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--o);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:99}
.frame{background:#000;border:1px solid var(--ln);border-radius:14px;margin:0 auto;overflow:hidden}.frame canvas{width:100%;height:100%;display:block;touch-action:none}
.bar{height:6px;background:var(--p2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--o);width:0;transition:width .3s}
.bubble{padding:8px 12px;border-radius:14px;max-width:75%;margin-bottom:8px;background:var(--p2)}.bubble.me{background:var(--o);color:#fff;margin-left:auto}
.full{position:fixed;inset:0;background:#000;z-index:30}.full canvas{width:100%;height:100%;display:block;touch-action:none}
.x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:#000b;font-size:14px;z-index:2}.tile.f{width:100%;height:100%}.dng{background:#d92d20!important;color:#fff!important;border:0!important}
.exit{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);left:6px;width:30px;height:30px;border-radius:50%;background:#0008;color:#fff;font-size:15px;line-height:30px;opacity:.7}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

function startCv(id){const cv=$(id);if(!cv)return;const r=cv.getBoundingClientRect();cv.width=r.width;cv.height=r.height;const x=cv.getContext('2d');let s=0,o=[...Array(5)].map(()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,dx:(Math.random()-.5)*3,dy:(Math.random()-.5)*3}));
cv.onpointerdown=e=>{const b=cv.getBoundingClientRect();o.forEach(q=>{if(Math.hypot(q.x-(e.clientX-b.left),q.y-(e.clientY-b.top))<26){q.x=Math.random()*cv.width;q.y=Math.random()*cv.height;s++}})};
const my=(gts[id]=(gts[id]||0)+1);(function f(){if(my!==gts[id]||!$(id))return;x.fillStyle='#0c0c0e';x.fillRect(0,0,cv.width,cv.height);o.forEach(q=>{q.x+=q.dx;q.y+=q.dy;if(q.x<0||q.x>cv.width)q.dx*=-1;if(q.y<0||q.y>cv.height)q.dy*=-1;x.fillStyle='#ff6a1a';x.beginPath();x.arc(q.x,q.y,14,0,7);x.fill()});x.fillStyle='#fff';x.font='16px sans-serif';x.fillText(s,12,24);requestAnimationFrame(f)})()}
